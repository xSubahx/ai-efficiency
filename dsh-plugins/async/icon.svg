<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Async">
  <defs>
    <linearGradient id="asx-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2c4d"/>
      <stop offset="1" stop-color="#0d1424"/>
    </linearGradient>
    <linearGradient id="asx-next" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6cb4ff"/>
      <stop offset="1" stop-color="#2f7bff"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#asx-bg)"/>
  <!-- kanban: three lifecycle columns of differing heights -->
  <rect x="11" y="30" width="11" height="14" rx="3.5" fill="#f2b24c" opacity="0.92"/>
  <rect x="26" y="16" width="11" height="28" rx="3.5" fill="#3ddc97" opacity="0.94"/>
  <rect x="41" y="23" width="11" height="13" rx="3.5" fill="url(#asx-next)" opacity="0.96"/>
  <!-- gantt: a shared time axis with one scheduled marker -->
  <path d="M10 52.5h44" stroke="#93a9c9" stroke-width="1.7" stroke-linecap="round" opacity="0.7"/>
  <circle cx="26" cy="52.5" r="2.6" fill="#eaf2ff"/>
  <circle cx="47" cy="52.5" r="2.2" fill="#5aa9ff"/>
</svg>
